#
# Build, test and lint the plugin on Arch Linux (the reference platform).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (KF6)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja ccache git \
            qt6-base krunner kcoreaddons ki18n knotifications kconfig \
            extra-cmake-modules
      - uses: actions/checkout@v7
      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure, build and test
        run: cmake --workflow --preset user

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed \
            git clang typos shellcheck yamllint editorconfig-checker
      - uses: actions/checkout@v7
      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: clang-format
        run: |
          files=$(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.hxx')
          [ -z "$files" ] || clang-format --dry-run --Werror $files
      - name: typos
        run: typos .
      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh' '*.bash')
          [ -z "$files" ] || shellcheck $files
      - name: yamllint
        run: yamllint .
      - name: editorconfig
        run: editorconfig-checker
